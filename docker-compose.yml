name: citepath-agent

# Local service endpoints
# MySQL: 127.0.0.1:3306 (database and username: citepath_agent)
# Milvus: 127.0.0.1:19530 (health check: http://127.0.0.1:9091/healthz)

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CITEPATH_MYSQL_ROOT_PASSWORD:?Run tools/configure_local.py first}
      MYSQL_DATABASE: citepath_agent
      MYSQL_USER: citepath_agent
      MYSQL_PASSWORD: ${CITEPATH_MYSQL_PASSWORD:?Run tools/configure_local.py first}
    ports:
      - "127.0.0.1:${CITEPATH_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER"
          "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  milvus-volume-init:
    image: milvusdb/milvus:v3.0.3
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ./volumes/milvus:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${CITEPATH_MINIO_USER:?Run tools/configure_local.py first}
      MINIO_ROOT_PASSWORD: ${CITEPATH_MINIO_PASSWORD:?Run tools/configure_local.py first}
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 10

  milvus:
    image: milvusdb/milvus:v3.0.3
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${CITEPATH_MINIO_USER:?Run tools/configure_local.py first}
      MINIO_SECRET_ACCESS_KEY: ${CITEPATH_MINIO_PASSWORD:?Run tools/configure_local.py first}
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    ports:
      - "127.0.0.1:${CITEPATH_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${CITEPATH_MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  attu:
    image: zilliz/attu:v2.5.12
    ports:
      - "127.0.0.1:${CITEPATH_ATTU_PORT:-3000}:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  mysql_data:
